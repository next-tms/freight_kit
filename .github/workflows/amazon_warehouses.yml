name: Update Amazon warehouses
on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.3'
      - run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
      - run: bundle exec rake amazon_warehouses:update
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- configuration/locations; then
            echo 'No changes'
            exit 0
          fi

          branch='amazon-warehouses'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git commit -m 'Update Amazon warehouses' -- configuration/locations
          git push --force origin "$branch"
          gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN || gh pr create \
            --title 'Update Amazon warehouses' \
            --body 'Generated by `rake amazon_warehouses:update` from OpenStreetMap.'
